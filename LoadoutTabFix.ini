; LoadoutTabFix v2 - swaps two keys in what the GAME sees (other plugins such as
; Liberty Loadout keep seeing the real keys).
; Values are Windows virtual-key codes (decimal).
;   9 = Tab   117 = F6   118 = F7   119 = F8   20 = Caps Lock   71 = G
[Keys]
; The key the game uses for the biker list (Tab in TLAD).
GameKey=9
; The key you want to press instead.
NewKey=117

[Hooks]
; Ways the game could read the keyboard. On the tested setup the game uses
; DirectInput and GetKeyboardState (WinApi); key messages are not used.
; Set Log=1 below to confirm which one your setup uses.
DirectInput=1
WinApi=1
Messages=0

[Misc]
; 1 = write LoadoutTabFix.log next to the plugin (useful if it does nothing)
Log=0
